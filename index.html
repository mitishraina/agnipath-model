<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgniPath 3D Model</title>
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      model-viewer {
        width: 100%;
        height: 100vh;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="Room_702_compressed.glb"
      alt="3D Model"
      auto-rotate
      camera-controls
      disable-zoom
      disable-pan
      disable-tap
      interaction-prompt="none"
      loading="eager"
      reveal="interaction"
      shadow-intensity="0"
      camera-orbit="0deg 75deg 105%"
      min-camera-orbit="auto auto 50%"
      max-camera-orbit="auto auto 150%"
      min-field-of-view="30deg"
      max-field-of-view="90deg"
      field-of-view="45deg"
      interpolation-decay="200"
      touch-action="none"
    ></model-viewer>
  </body>
</html>
